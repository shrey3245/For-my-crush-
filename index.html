<!DOCTYPE html>
<html lang="en">

<title>💖☺️ Mikriti 💖🐱</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;min-height:100vh;padding:75px 14px 25px;
 display:grid;place-items:center;overflow-x:hidden;
 font-family:"Segoe UI",sans-serif;text-align:center;
 background:radial-gradient(circle at top,#572447,#190f25 65%,#100b18);
 color:#402437;
}

.heart-bg{
 position:fixed;inset:0;overflow:hidden;
 pointer-events:none;z-index:0;
}

.heart,.floating-word{
 position:absolute;bottom:-45px;pointer-events:none;
 animation:floatUp linear forwards;
}

.floating-word{
 color:rgba(255,182,193,.65);
 font-size:13px;font-weight:bold;white-space:nowrap;
}

@keyframes floatUp{
 to{transform:translateY(-110vh) rotate(25deg);opacity:0}
}

@keyframes fade{
 from{opacity:0;transform:translateY(10px)}
 to{opacity:1;transform:translateY(0)}
}

.container{
 position:relative;z-index:2;width:min(100%,440px);
 padding:27px 22px;border-radius:28px;
 background:linear-gradient(145deg,#fff8fc,#ffe5f0);
 box-shadow:0 20px 65px #0008;
 border:1px solid #ffffffa0;
}

.topline{
 color:#c04b7c;font-size:11px;font-weight:bold;
 letter-spacing:1.5px;line-height:1.8;
}

.progress-wrap{
 height:6px;background:#f4cfdf;border-radius:10px;
 margin:18px 0 24px;overflow:hidden;
}

.progress{
 height:100%;width:12.5%;
 background:linear-gradient(90deg,#ff91b9,#ec347e);
 transition:width .4s;
}

.step-box{display:none}
.step-box.active{display:block;animation:fade .4s ease}

.gif-img,.gif-frame{
 display:block;width:100%;max-width:300px;height:200px;
 object-fit:contain;margin:0 auto 14px;
 border:0;border-radius:20px;
}

.gif-img{width:180px;height:180px}

#step1 .gif-img{
 width:100%;max-width:390px;height:auto;
 object-fit:contain;margin:0 auto 14px;
}

h2{

 margin:0 0 10px;color:#48283d;
}

.sub-text{
 font-size:15px;line-height:1.8;color:#806a7a;
 margin:0 auto 18px;overflow-wrap:anywhere;
}
