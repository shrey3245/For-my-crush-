<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Special One 💖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            text-align: center;
        }

        /* Floating Hearts Animation */
        .heart-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }
        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            animation: floatUp 5s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            max-width: 90%;
            width: 380px;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .poetry-box {
            background: #fff0f3;
            border-left: 4px solid #ff4b5c;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            font-style: italic;
            color: #555;
            font-size: 15px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            justify-content: space-around;
            position: relative;
            height: 60px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }

        #yesBtn {
            background-color: #28a745;
            color: white;
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        #noBtn {
            background-color: #dc3545;
            color: white;
            position: absolute;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4);
        }

        .hidden-message {
            display: none;
            margin-top: 20px;
            font-size: 20px;
            color: #d63384;
            font-weight: bold;
            animation: popIn 0.5s ease-in-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Background Floating Hearts -->
    <div class="heart-bg" id="heartBg"></div>

    <div class="container" id="mainContainer">
        <h1 id="questionText">Aapki aankhon mein kuch khaas baat hai... 🥺💖</h1>
        
        <div class="poetry-box">
            "Sunkar tumhari baatein ek naya sukoon milta hai,<br>
            Jaise khile hue phoolon mein dil ka gulab khilta hai.<br>
            Batao na, kya tum humari poori zindagi banna chahogi?"
        </div>

        <div class="buttons" id="btnGroup">
            <button class="btn" id="yesBtn" onclick="sayYes()">Yes! 🥰</button>
            <button class="btn" id="noBtn" onmouseover="moveNo()" ontouchstart="moveNo()">No 😢</button>
        </div>

        <div class="hidden-message" id="successMsg">
            Yayyy! You just made me the happiest person alive! 🎉❤️✨
        </div>
    </div>

    <script>
        // Create Floating Hearts Dynamically
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.getElementById('heartBg').appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
        setInterval(createHeart, 300);

        // Move 'No' Button logic
        function moveNo() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 80);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 80);
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        // 'Yes' Click logic
        function sayYes() {
            document.getElementById('questionText').style.display = 'none';
            document.querySelector('.poetry-box').style.display = 'none';
            document.getElementById('btnGroup').style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
            document.body.style.background = 'linear-gradient(135deg, #ff0844, #ffb199)';
        }
    </script>
</body>
  </html>
